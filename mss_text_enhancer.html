<script>
document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('enhanceweb-button').addEventListener('click', function() {

    const textarea = document.getElementById('enhance-text-holder');
    let text = textarea.value;
    // console.log('Исходный текст:', text);
    
    // Применяем все правила замены
    text = text
        // Убираем нули после запятой
        .replaceAll(/(\d),0{1,}(?!\d)/g, "$1")
        // Убираем нули на конце десятичных дробей
        .replaceAll(/(\d),(\d{1,})(0{1,})/g, "$1,$2")
        // Убираем пробелы между цифрами символом %
        .replaceAll(/(\d)\s%/g, "$1%")
        // Убираем пробелы между символом № и цифрой
        .replaceAll(/№\s(\d)/g, "№$1")
        // -
        // Заменяем нули в числах на соответствующие сокращения
        .replaceAll(/(\s)000\s?000\s?000\s?000\s/g, '$1трлн ')
        .replaceAll(/(\s)000\s?000\s?000\s/g, '$1млрд ')
        .replaceAll(/(\s)000\s?000\s/g, '$1млн ')
        .replaceAll(/(\s)000\s/g, '$1тыс. ')
        // Отменяем замену на сокращение для названий станов
        .replaceAll(/(стан)(а|у|ом|е|ы|ов)?(х|м)?(и)?\s(1|2|3|4|5)тыс\./gi, '$1$2$3 $4000')
        // Отменяем замену тысяч на сокращение для годов
        .replaceAll(/(1|2)тыс\.\s(год|г\.)/gi, '$1000 $2')
        // Отменяем замену на сокращение для остального
        .replaceAll(/(ИНН|КПП|БИК|номер|тел|ОГРН|№|href)(.{1-5})?(\s)?(\d{1,})(млрд)/gi, '$1$2$3$4000000000')
        .replaceAll(/(ИНН|КПП|БИК|номер|тел|ОГРН|№|href)(.{1-5})?(\s)?(\d{1,})(млн)/gi, '$1$2$3$4000000')
        .replaceAll(/(ИНН|КПП|БИК|номер|тел|ОГРН|№|href)(.{1-5})?(\s)?(\d{1,})(тыс.)/gi, '$1$2$3$4000')
        // -
        // Добавляем пробел между числом и сокращением
        .replaceAll(/(\d)(млрд|млн|тыс\.)/g, '$1 $2')
        // Сокращаем полные написания чисел
        .replaceAll(/(\d)\s(тысяч)(а|и|у|ей)?(м|ми)?/g, '$1 тыс.')
        .replaceAll(/(\d)\s(миллион)(а|ов)?(ми)?/g, '$1 млн')
        .replaceAll(/(\d)\s(миллиард)(а|ов)?(ми)?/g, '$1 млрд')
        .replaceAll(/(\d)\s(триллион)(а|ов)?(ми)?/g, '$1 трлн')
        // -
        // Делаем правильное написание квадратов и кубов для html текста
        .replaceAll(/(\d|тыс\.|млн|млрд)\s(м2|м&sup2;|м²)/g, "$1 м<sup>2</sup>")
        .replaceAll(/(\d|тыс\.|млн|млрд)\s(кв\.?)(адратн)?(ых|ими|ого|ым)?\s?(м)(етр)?(ов|ах|ам)?(и)?/g, "$1 м<sup>2</sup>")
        .replaceAll(/(\d|тыс\.|млн|млрд)\s(км2|км&sup2;|км²)/g, "$1 км<sup>2</sup>")
        .replaceAll(/(\d|тыс\.|млн|млрд)\s(кв\.?)(адратн)?(ых|ими|ого|ым)?\s?(км|километр)(ов|ах|ам)?(и)?/g, "$1 км<sup>2</sup>")
        .replaceAll(/(\d|тыс\.|млн|млрд)\s(м3|м&sup3;|м³)/g, "$1 м<sup>3</sup>")
        .replaceAll(/(\d|тыс\.|млн|млрд)\s(куб\.?)(ическ)?(их|ими|ого|им)?\s?(м)(етр)?(ов|ах|ам)?(и)?/g, "$1 м<sup>3</sup>")
        .replaceAll(/(\d|тыс\.|млн|млрд)\s(кубометр)(ов|ам|у)?(и)?/g, "$1 м<sup>3</sup>")
        // -
        // Делаем сокращения единиц измерения
        .replaceAll(/(\d{4})\s(год)(а|у)?/g, "$1 г.")
        .replaceAll(/(\d|тыс\.|млн|млрд|трлн)\.?\s(рубл)(ей|я|ь)(ми|х)?/g, '$1 руб.')
        .replaceAll(/(руб\.\.)/g, 'руб.')
        .replaceAll(/(\d|тыс\.|млн|млрд|трлн)\.?\s(тонн)(а|ы|у|е)?(ми|х)?/g, '$1 т')
        .replaceAll(/(\d|тыс\.|млн|млрд)\.?\s(килограмм)(а|ов|ом)?(ми|х)?/g, '$1 кг')
        .replaceAll(/(\d|тыс\.|млн|млрд)\.?\s(грамм)(а|ов|ом)?(ми|х)?/g, '$1 г')
        .replaceAll(/(\d|тыс\.|млн|млрд)\.?\s(километр)(а|ов|ом)?(ми|х)?/g, '$1 км')
        .replaceAll(/(\d|тыс\.|млн|млрд)\.?\s(метр)(а|ов|ом)?(ми|х)?/g, '$1 м')
        .replaceAll(/(\d|тыс\.|млн|млрд)\.?\s(сантиметр)(а|ов|ом)?(ми|х)?/g, '$1 см')
        .replaceAll(/(\d|тыс\.|млн|млрд)\.?\s(миллиметр)(а|ов|ом)?(ми|х)?/g, '$1 мм')
        // Меняем сокращение промежутка лет на правильное
        .replaceAll(/(\d{4})\s(г\.)(ы|ов)/g, "$1 гг.")
        // -
        // Делаем пробел между символами и цифрами после них
        //.replaceAll(/(&mdash;|&ndash;|-|–|=|~)(\d{1,})/g, "$1 $2")
        // Делаем пробелы между разрядами чисел
        //.replaceAll(/(?<!(?:БИК[\s\S]{1,5}|ОГРН[\s\S]{1,5}|КПП[\s\S]{1,5}|номер[\s\S]{1,5}|ГОСТ[\s\S]{1,5}|ИНН[\s\S]{1,5}|тел[\s\S]{1,6}|href[\s\S]{1,7}|№))\s?(\d{3})(\d{3})(\d{3})/g, " $1 $2 $3")
        .replaceAll(/\s(\d{3})(\d{3})(\d{3})\b/g, " $1 $2 $3")
        .replaceAll(/\s(\d{2})(\d{3})(\d{3})\b/g, " $1 $2 $3")
        .replaceAll(/\s(\d{1})(\d{3})(\d{3})\b/g, " $1 $2 $3")
        .replaceAll(/\s(\d{3})(\d{3})\b/g, " $1 $2")
        .replaceAll(/\s(\d{2})(\d{3})\b/g, " $1 $2")
        .replaceAll(/(БИК|ОГРН|КПП|номер|ГОСТ|ГОСТ\sР|ГОСТ-Р|ИНН|тел|href|№)(\S{1,2})?\s(\d{3})\s(\d{3})\s(\d{3})?/g, "$1$2 $3$4$5")
        .replaceAll(/(БИК|ОГРН|КПП|номер|ГОСТ|ГОСТ\sР|ГОСТ-Р|ИНН|тел|href|№)(\S{1,2})?\s(\d{2})\s(\d{3})\s(\d{3})?/g, "$1$2 $3$4$5")
        .replaceAll(/(БИК|ОГРН|КПП|номер|ГОСТ|ГОСТ\sР|ГОСТ-Р|ИНН|тел|href|№)(\S{1,2})?\s(\d{1})\s(\d{3})\s(\d{3})?/g, "$1$2 $3$4$5")
        .replaceAll(/(БИК|ОГРН|КПП|номер|ГОСТ|ГОСТ\sР|ГОСТ-Р|ИНН|тел|href|№)(\S{1,2})?\s(\d{3})\s(\d{3})?/g, "$1$2 $3$4")
        .replaceAll(/(БИК|ОГРН|КПП|номер|ГОСТ|ГОСТ\sР|ГОСТ-Р|ИНН|тел|href|№)(\S{1,2})?\s(\d{2})\s(\d{3})?/g, "$1$2 $3$4")
        // .replaceAll(/(\d{1})(\d{3})(?!\s(?:год|г\.[А-ЯA-Z]|г\.\.))/g, "$1 $2 ")
        // -
        .replaceAll(/(1)-?(ое|ому|ого|му|го|ым|ом|е|о|у|м)?\s?(полугоди)(ем|я|ю|и|е\s)/gi, "I $3$4")
        .replaceAll(/(перв)(ое|ому|ого|ым|ом)\s(полугоди)(ем|я|ю|и|е\s)/gi, "I $3$4")
        .replaceAll(/(2)-?(ое|ому|ого|му|го|ым|ом|е|о|у|м)?\s?(полугоди)(ем|я|ю|и|е\s)/gi, "II $3$4")
        .replaceAll(/(втор)(ое|ому|ого|ым|ом)\s(полугоди)(ем|я|ю|и|е\s)/gi, "II $3$4")
        // -
        .replaceAll(/(1)-?(ый|ому|ого|му|го|ым|й|о|у|м)?\s(квартал)(а|у|е|ом)?/gi, "I $3$4")
        .replaceAll(/(перв)(ый|ому|ого|ым|ом)\s(квартал)(а|у|е|ом)?/gi, "I $3$4")
        .replaceAll(/(2)-?(ой|ому|ого|му|го|ым|й|о|у|м)?\s(квартал)(а|у|е|ом)?/gi, "II $3$4")
        .replaceAll(/(втор)(ой|ому|ого|ым|ом)\s(квартал)(а|у|е|ом)?/gi, "II $3$4")
        .replaceAll(/(3)-?(ый|ому|ого|му|го|ым|й|о|у|м)?\s(квартал)(а|у|е|ом)?/gi, "III $3$4")
        .replaceAll(/(трет)(ий|ьему|ьего|ьим|ьем\s)\s?(квартал)(а|у|е|ом)?/gi, "III $3$4")
        .replaceAll(/(4)-?(ый|ому|ого|му|го|ым|й|о|у|м)?\s(квартал)(а|у|е|ом)?/gi, "IV $3$4")
        .replaceAll(/(четверт|четвёрт)(ый|ому|ого|ым|ом)\s(квартал)(а|у|е|ом)?/gi, "IV $3$4")
        // -
        .replaceAll(/(ё)/g, "е")
        .replaceAll(/(Ё)/g, "Е")
        .replaceAll(/(—)/g, "&ndash;")
        .replaceAll(/(&mdash;)/g, "&ndash;")
        //.replaceAll(/<p>(.{1,})\s(-)\s(.{1,})<\/p>/g, "<p>$2 &ndash; $4</p>")
        .replaceAll(/(\s)(-)(\s)/g, "$1&ndash;$3")
        //.replaceAll(/<p>(.{1,})\s(–)\s/g, "<p>$1 &ndash; ")
        //.replaceAll(/<p>(.{1,})&quot;(.{1,})&quot;\s(.{1,})<\/p>/g, "<p>$1&laquo;$2&raquo; $3</p>")
        //.replaceAll(/"(.{1,})",\s–/g, "«$1», –")
        //.replaceAll(/"(.{1,})"\s/g, "«$1» ")
        // -
        .replaceAll(/(г|тыс|руб)\.\./g, '$1.');

    // Обновляем содержимое textarea
    textarea.value = text;
    });
});
</script>

        .replaceAll(/(\d|тыс\.|млн|млрд)\.?\s(километр)(а|ов|ом)?(ми|х)?(\s|\.)/g, '$1 км$5')
        .replaceAll(/(\d|тыс\.|млн|млрд)\.?\s(метр)(а|ов|ом)?(ми|х)?(\s|\.)/g, '$1 м$5')
        .replaceAll(/(\d|тыс\.|млн|млрд)\.?\s(сантиметр)(а|ов|ом)?(ми|х)?(\s|\.)/g, '$1 см$5')
        .replaceAll(/(\d|тыс\.|млн|млрд)\.?\s(миллиметр)(а|ов|ом)?(ми|х)?(\s|\.)/g, '$1 мм$5')
        // Меняем сокращение промежутка лет на правильное
        .replaceAll(/(\d{4})\s(г\.)(ы|ов)/g, "$1 гг.")
        // -
        // Делаем пробел между символами и цифрами после них
        //.replaceAll(/(&mdash;|&ndash;|-|–|=|~)(\d{1,})/g, "$1 $2")
        // Делаем пробелы между разрядами чисел
        //.replaceAll(/(?<!(?:БИК[\s\S]{1,5}|ОГРН[\s\S]{1,5}|КПП[\s\S]{1,5}|номер[\s\S]{1,5}|ГОСТ[\s\S]{1,5}|ИНН[\s\S]{1,5}|тел[\s\S]{1,6}|href[\s\S]{1,7}|№))\s?(\d{3})(\d{3})(\d{3})/g, " $1 $2 $3")
        .replaceAll(/\s(\d{3})(\d{3})(\d{3})\b/g, " $1 $2 $3")
        .replaceAll(/\s(\d{2})(\d{3})(\d{3})\b/g, " $1 $2 $3")
        .replaceAll(/\s(\d{1})(\d{3})(\d{3})\b/g, " $1 $2 $3")
        .replaceAll(/\s(\d{3})(\d{3})\b/g, " $1 $2")
        .replaceAll(/\s(\d{2})(\d{3})\b/g, " $1 $2")
        .replaceAll(/(БИК|ОГРН|КПП|номер|ГОСТ|ГОСТ\sР|ГОСТ-Р|ИНН|тел|href|№)(\S{1,2})?\s(\d{3})\s(\d{3})\s(\d{3})?/g, "$1$2 $3$4$5")
        .replaceAll(/(БИК|ОГРН|КПП|номер|ГОСТ|ГОСТ\sР|ГОСТ-Р|ИНН|тел|href|№)(\S{1,2})?\s(\d{2})\s(\d{3})\s(\d{3})?/g, "$1$2 $3$4$5")
        .replaceAll(/(БИК|ОГРН|КПП|номер|ГОСТ|ГОСТ\sР|ГОСТ-Р|ИНН|тел|href|№)(\S{1,2})?\s(\d{1})\s(\d{3})\s(\d{3})?/g, "$1$2 $3$4$5")
        .replaceAll(/(БИК|ОГРН|КПП|номер|ГОСТ|ГОСТ\sР|ГОСТ-Р|ИНН|тел|href|№)(\S{1,2})?\s(\d{3})\s(\d{3})?/g, "$1$2 $3$4")
        .replaceAll(/(БИК|ОГРН|КПП|номер|ГОСТ|ГОСТ\sР|ГОСТ-Р|ИНН|тел|href|№)(\S{1,2})?\s(\d{2})\s(\d{3})?/g, "$1$2 $3$4")
        // .replaceAll(/(\d{1})(\d{3})(?!\s(?:год|г\.[А-ЯA-Z]|г\.\.))/g, "$1 $2 ")
        // -
        .replaceAll(/(1)-?(ое|ому|ого|му|го|ым|ом|е|о|у|м)?\s?(полугоди)(ем|я|ю|и|е\s)/gi, "I $3$4")
        .replaceAll(/(перв)(ое|ому|ого|ым|ом)\s(полугоди)(ем|я|ю|и|е\s)/gi, "I $3$4")
        .replaceAll(/(2)-?(ое|ому|ого|му|го|ым|ом|е|о|у|м)?\s?(полугоди)(ем|я|ю|и|е\s)/gi, "II $3$4")
        .replaceAll(/(втор)(ое|ому|ого|ым|ом)\s(полугоди)(ем|я|ю|и|е\s)/gi, "II $3$4")
        // -
        .replaceAll(/(1)-?(ый|ому|ого|му|го|ым|й|о|у|м)?\s(квартал)(а|у|е|ом)?/gi, "I $3$4")
        .replaceAll(/(перв)(ый|ому|ого|ым|ом)\s(квартал)(а|у|е|ом)?/gi, "I $3$4")
        .replaceAll(/(2)-?(ой|ому|ого|му|го|ым|й|о|у|м)?\s(квартал)(а|у|е|ом)?/gi, "II $3$4")
        .replaceAll(/(втор)(ой|ому|ого|ым|ом)\s(квартал)(а|у|е|ом)?/gi, "II $3$4")
        .replaceAll(/(3)-?(ый|ому|ого|му|го|ым|й|о|у|м)?\s(квартал)(а|у|е|ом)?/gi, "III $3$4")
        .replaceAll(/(трет)(ий|ьему|ьего|ьим|ьем\s)\s?(квартал)(а|у|е|ом)?/gi, "III $3$4")
        .replaceAll(/(4)-?(ый|ому|ого|му|го|ым|й|о|у|м)?\s(квартал)(а|у|е|ом)?/gi, "IV $3$4")
        .replaceAll(/(четверт|четвёрт)(ый|ому|ого|ым|ом)\s(квартал)(а|у|е|ом)?/gi, "IV $3$4")
        // -
        .replaceAll(/(ё)/g, "е")
        .replaceAll(/(Ё)/g, "Е")
        .replaceAll(/(—)/g, "–")
        .replaceAll(/(&mdash;)/g, "&ndash;")
        .replaceAll(/<p>(.{1,})\s(-)\s(.{1,})<\/p>/g, "<p>$2 &ndash; $4</p>")
        .replaceAll(/\s(-)\s/g, " – ")
        .replaceAll(/<p>(.{1,})\s(–)\s/g, "<p>$1 &ndash; ")
        .replaceAll(/<p>(.{1,})&quot;(.{1,})&quot;\s(.{1,})<\/p>/g, "<p>$1&laquo;$2&raquo; $3</p>")
        // .replaceAll(/"(.{1,})",\s–/g, "«$1», –")
        //.replaceAll(/"(.{1,})"\s/g, "«$1» ")
        // -
        .replaceAll(/(г|тыс|руб)\.\./g, '$1.');

    // Обновляем содержимое textarea
    textarea.value = text;
    });
});
</script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('deenter-button').addEventListener('click', function() {

    const textarea = document.getElementById('enhance-text-holder');
    let text = textarea.value;

    // Применяем все правила замены
    text = text
        .replaceAll(/\r?\n/g, " ");

    // Обновляем содержимое textarea
    textarea.value = text;
    });
});
</script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('despace-button').addEventListener('click', function() {

    const textarea = document.getElementById('enhance-text-holder');
    let text = textarea.value;

    // Применяем все правила замены
    text = text
        .replaceAll(/\s\s{1,}/g, " ");

    // Обновляем содержимое textarea
    textarea.value = text;
    });
});
</script>
